<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SMASH & CHIPS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .login-container { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .admin-container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1, h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .btn-secondary { background: #6c757d; margin-left: 10px; }
        .btn-danger { background: #dc3545; }
        .btn-sm { padding: 8px 15px; font-size: 12px; }
        .hidden { display: none; }
        .product-item { background: #f8f9fa; padding: 15px; margin-bottom: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; transition: all 0.3s; }
        .product-item:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-color: #667eea; }
        .product-content { display: flex; align-items: center; gap: 20px; }
        .product-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); background: #eee; }
        .product-info h3 { color: #333; margin-bottom: 5px; font-size: 18px; }
        .product-info p { color: #666; font-size: 14px; margin-bottom: 3px; }
        .product-actions { display: flex; gap: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .form-section { background: #f8f9fa; padding: 25px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #eee; position: relative; }
        .success-msg { background: #28a745; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; font-weight: bold; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .image-preview-container { margin-top: 15px; border: 2px dashed #ddd; padding: 15px; border-radius: 10px; background: #fff; display: none; text-align: center; }
        #previewImg { max-height: 200px; max-width: 100%; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .gallery-container { display: none; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; max-height: 400px; overflow-y: auto; padding: 10px; background: #fdfdfd; border-radius: 8px; border: 1px solid #eee; }
        .gallery-item { position: relative; cursor: pointer; border: 2px solid transparent; border-radius: 8px; overflow: hidden; }
        .gallery-item img { width: 100%; height: 100px; object-fit: cover; }
        .gallery-item.selected { border-color: #28a745; }
        .btn-delete-img { position: absolute; top: 5px; right: 5px; background: #dc3545; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="font-weight: bold;">Se procesează...</p>
    </div>

    <div id="successMsg" class="success-msg">✅ Modificări salvate!</div>

    <div id="loginContainer" class="login-container">
        <h1>🔐 Admin Login</h1>
        <div class="form-group">
            <label>Parolă:</label>
            <input type="password" id="password" placeholder="Introdu parola" onkeypress="if(event.key==='Enter') login()">
        </div>
        <button onclick="login()" style="width: 100%;">Login</button>
    </div>

    <div id="adminContainer" class="admin-container hidden">
        <div class="header">
            <h1>📊 Administrare Produse</h1>
            <div>
                <button class="btn-secondary" onclick="loadProducts()">🔄 Refresh Listă</button>
                <button class="btn-secondary" onclick="logout()">Deconectare</button>
            </div>
        </div>

        <div class="form-section">
            <h2 id="formTitle">➕ Adaugă Produs Nou</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Nume Produs:</label>
                        <input type="text" id="productName" placeholder="Ex: Classic Smash" required>
                    </div>
                    <div class="form-group">
                        <label>Categorie:</label>
                        <select id="productCategory" required>
                            <option value="BURGER">Burgeri</option>
                            <option value="CARTOFI">Cartofi</option>
                            <option value="KEBAB PUI">Kebab Pui</option>
                            <option value="BĂUTURI">Băuturi</option>
                            <option value="SOS">SOS</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Emoji Categorie:</label>
                        <input type="text" id="productCategoryEmoji" placeholder="🍔">
                    </div>
                    <div class="form-group">
                        <label>Preț (RON):</label>
                        <input type="text" id="productPrice" placeholder="38.00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Descriere:</label>
                    <textarea id="productDescription" rows="2" placeholder="Descriere produs..."></textarea>
                </div>

                <div class="form-group">
                    <label>Imagine Produs:</label>
                    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                        <input type="text" id="productImage" placeholder="Nume fișier imagine..." readonly style="flex: 1; background: #f9f9f9;">
                        <button type="button" class="btn-sm" onclick="document.getElementById('productImageFile').click()">📷 Încarcă Poza</button>
                        <button type="button" class="btn-sm btn-secondary" id="galleryBtn" onclick="toggleGallery()">🖼️ Galeria Server</button>
                        <input type="file" id="productImageFile" accept="image/*" style="display:none">
                    </div>

                    <div id="imagePreview" class="image-preview-container">
                        <p style="margin-bottom: 5px; font-size: 12px; color: #666;">Preview: <span id="imageName" style="font-weight: bold;"></span></p>
                        <img id="previewImg" src="" alt="Preview">
                        <br>
                        <button type="button" class="btn-sm btn-danger" onclick="resetImage()">Elimină Poza</button>
                    </div>

                    <div id="galleryContainer" class="gallery-container">
                        <!-- Images will be loaded here -->
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Ingrediente:</label>
                        <input type="text" id="productIngredients" placeholder="Carne vită, Sos, Cheddar...">
                    </div>
                    <div class="form-group">
                        <label>Alergeni:</label>
                        <input type="text" id="productAllergens" placeholder="Gluten, Ouă, Lapte">
                    </div>
                </div>

                <div class="form-group">
                    <label>Valori Nutriționale:</label>
                    <input type="text" id="productNutrition" placeholder="270 Kcal/100g">
                </div>

                <button type="submit" id="submitBtn">💾 Salvează Produs</button>
                <button type="button" class="btn-secondary" onclick="resetForm()">Anulează / Reset</button>
            </form>
        </div>

        <div class="header">
            <h2>📦 Produse în Meniu (<span id="productCount">0</span>)</h2>
        </div>
        <div id="productsList">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <script>
        const PASSWORD = "Pasaj2012";
        let products = [];
        let editingId = null;
        let pendingImageData = null;

        function login() {
            if (document.getElementById('password').value === PASSWORD) {
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('adminContainer').classList.remove('hidden');
                loadProducts();
                loadGallery();
            } else {
                alert('Parolă incorectă!');
            }
        }

        function logout() {
            document.getElementById('adminContainer').classList.add('hidden');
            document.getElementById('loginContainer').classList.remove('hidden');
            document.getElementById('password').value = '';
        }

        function showLoading(show, text = 'Se procesează...') {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
            document.getElementById('loadingText').textContent = text;
        }

        async function loadProducts() {
            showLoading(true, 'Se încarcă lista de produse...');
            try {
                const response = await fetch(`https://raw.githubusercontent.com/ulieruionut-lgtm/smash-chips-brasov/main/products.json?v=${Date.now()}`);
                const data = await response.json();
                products = Array.isArray(data) ? data : (data.products || []);
                document.getElementById('productCount').textContent = products.length;
                displayProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                alert('Eroare la încărcarea produselor. Verifică conexiunea.');
            } finally {
                showLoading(false);
            }
        }

        function displayProducts() {
            const list = document.getElementById('productsList');
            list.innerHTML = '';
            
            // Sort by category
            const sortedProducts = [...products].sort((a,b) => a.category.localeCompare(b.category));

            sortedProducts.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product-item';
                const encodedImage = p.image ? encodeURIComponent(p.image) : '';
                const thumbPath = p.image ? `images/${encodedImage}` : 'images/placeholder.png';
                
                div.innerHTML = `
                    <div class="product-content">
                        <img src="${thumbPath}" class="product-thumb" alt="${p.name}" onerror="this.src='https://placehold.co/80?text=Fara+Poza'">
                        <div class="product-info">
                            <h3>${p.name} - ${p.price} RON</h3>
                            <p><strong>${p.category}</strong> | ${p.description || 'Fără descriere'}</p>
                            <p style="font-size: 11px; color: #999;">Fișier Imagine: ${p.image || 'N/A'}</p>
                        </div>
                    </div>
                    <div class="product-actions">
                        <button class="btn-sm" onclick="editProduct(${p.id})">✏️ Editează</button>
                        <button class="btn-sm btn-danger" onclick="deleteProduct(${p.id})">🗑️ Șterge</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function loadGallery() {
            try {
                const resp = await fetch('/api/save-products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'list-images' })
                });
                const data = await resp.json();
                if (data.images) {
                    const gallery = document.getElementById('galleryContainer');
                    gallery.innerHTML = '';
                    data.images.forEach(imgObj => {
                        const imgName = (typeof imgObj === 'string') ? imgObj : imgObj.name;
                        const div = document.createElement('div');
                        div.className = 'gallery-item';
                        div.onclick = () => selectFromGallery(imgName);
                        
                        const encodedImg = encodeURIComponent(imgName);
                        div.innerHTML = `
                            <img src="images/${encodedImg}" alt="${imgName}">
                            <div style="font-size: 10px; text-align: center; padding: 2px;">${imgName}</div>
                            <button class="btn-delete-img" onclick="event.stopPropagation(); deleteImage('${imgName}')">×</button>
                        `;
                        gallery.appendChild(div);
                    });
                }
            } catch (err) {
                console.error('Error loading gallery:', err);
            }
        }

        function toggleGallery() {
            const g = document.getElementById('galleryContainer');
            const isHidden = g.style.display === 'none' || g.style.display === '';
            g.style.display = isHidden ? 'grid' : 'none';
            if (isHidden) loadGallery();
        }

        function selectFromGallery(filename) {
            document.getElementById('productImage').value = filename;
            const encoded = encodeURIComponent(filename);
            document.getElementById('previewImg').src = `images/${encoded}`;
            document.getElementById('imagePreview').style.display = 'block';
            document.getElementById('imageName').textContent = filename;
            pendingImageData = null;
            showSuccess('Imagine selectată din server: ' + filename);
        }

        async function deleteImage(filename) {
            if (!confirm('Ștergi definitiv poza "' + filename + '" de pe server?')) return;
            
            showLoading(true, 'Se șterge imaginea...');
            try {
                const resp = await fetch('/api/save-products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete-image', filename })
                });
                if (resp.ok) {
                    loadGallery();
                    if (document.getElementById('productImage').value === filename) {
                        resetImage();
                    }
                    showSuccess('Imagine ștearsă.');
                }
            } catch (err) {
                alert('Eroare la ștergere: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        function compressImage(base64Str, maxWidth = 1000, maxHeight = 1000) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
            });
        }

        document.getElementById('productImageFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                showLoading(true, 'Se procesează imaginea...');
                const reader = new FileReader();
                reader.onload = async function(event) {
                    try {
                        const compressedData = await compressImage(event.target.result);
                        document.getElementById('previewImg').src = compressedData;
                        document.getElementById('imageName').textContent = file.name;
                        document.getElementById('imagePreview').style.display = 'block';
                        document.getElementById('productImage').value = file.name;
                        pendingImageData = compressedData;
                        showSuccess('Poză pregătită pentru upload: ' + file.name);
                    } catch (err) {
                        alert('Eroare la procesarea imaginii.');
                    } finally {
                        showLoading(false);
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('productName').value.trim();
            const price = document.getElementById('productPrice').value.trim();

            if (!name || !price) {
                alert('Numele și Prețul sunt obligatorii!');
                return;
            }

            const product = {
                id: editingId || (products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1),
                name: name,
                category: document.getElementById('productCategory').value,
                categoryEmoji: document.getElementById('productCategoryEmoji').value || '🍔',
                description: document.getElementById('productDescription').value,
                price: price,
                image: document.getElementById('productImage').value,
                ingredients: document.getElementById('productIngredients').value,
                allergens: document.getElementById('productAllergens').value,
                nutrition: document.getElementById('productNutrition').value
            };

            let updatedProducts = [...products];
            if (editingId) {
                const idx = updatedProducts.findIndex(p => p.id === editingId);
                updatedProducts[idx] = product;
            } else {
                updatedProducts.push(product);
            }

            await saveToGitHub(updatedProducts, pendingImageData, product.image);
        });

        async function saveToGitHub(updatedProductsList, imageData, filename) {
            showLoading(true, 'Se salvează datele...');
            try {
                // 1. Upload image if new one was selected
                if (imageData && filename) {
                    showLoading(true, 'Se încarcă imaginea pe server...');
                    const imgResp = await fetch('/api/save-products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'upload-image', filename, imageData })
                    });
                    if (!imgResp.ok) throw new Error('Eroare la încărcarea imaginii');
                }

                // 2. Save products.json
                showLoading(true, 'Se actualizează baza de date (products.json)...');
                const resp = await fetch('/api/save-products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ products: updatedProductsList })
                });

                if (resp.ok) {
                    showSuccess('✅ PRODUS SALVAT CU SUCCES!');
                    resetForm();
                    // Wait for GitHub to sync
                    setTimeout(() => {
                        loadProducts();
                        loadGallery();
                    }, 1500);
                } else {
                    throw new Error('Eroare la salvare JSON');
                }
            } catch (err) {
                console.error('Save error:', err);
                alert('EROARE LA SALVARE: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (p) {
                editingId = id;
                document.getElementById('formTitle').textContent = '✏️ Editează Produs: ' + p.name;
                document.getElementById('productName').value = p.name;
                document.getElementById('productCategory').value = p.category;
                document.getElementById('productCategoryEmoji').value = p.categoryEmoji || '';
                document.getElementById('productDescription').value = p.description || '';
                document.getElementById('productPrice').value = p.price;
                document.getElementById('productImage').value = p.image || '';
                document.getElementById('productIngredients').value = p.ingredients || '';
                document.getElementById('productAllergens').value = p.allergens || '';
                document.getElementById('productNutrition').value = p.nutrition || '';
                
                if (p.image) {
                    const encoded = encodeURIComponent(p.image);
                    document.getElementById('previewImg').src = `images/${encoded}`;
                    document.getElementById('imagePreview').style.display = 'block';
                    document.getElementById('imageName').textContent = p.image;
                } else {
                    document.getElementById('imagePreview').style.display = 'none';
                }
                
                pendingImageData = null;
                document.getElementById('submitBtn').textContent = '💾 Salvează Modificările';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function deleteProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (confirm('Ești sigur că vrei să ștergi produsul "' + p.name + '"?')) {
                const updated = products.filter(p => p.id !== id);
                await saveToGitHub(updated);
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            editingId = null;
            pendingImageData = null;
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('formTitle').textContent = '➕ Adaugă Produs Nou';
            document.getElementById('submitBtn').textContent = '💾 Salvează Produs';
            document.getElementById('productImage').value = '';
        }

        function resetImage() {
            document.getElementById('productImage').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            pendingImageData = null;
            document.getElementById('productImageFile').value = '';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
